name: Bundle Notebook JS

on:
  push:
    branches:
      - main
    paths:
      - 'notebook-generic.js'
      - 'text-cells.js'
      - 'markdown-cells.js'
      - 'code-cells.js'

permissions:
  contents: write 

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Concatenate and Minify
        run: |
          cat notebook-generic.js text-cells.js markdown-cells.js code-cells.js > pynote-bundle.js
          npx terser pynote-bundle.js -o pynote-bundle.min.js --compress --mangle
          rm pynote-bundle.js 

      - name: Commit Bundled Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Auto-bundle notebook JS components [skip ci]"
          file_pattern: 'pynote-bundle.min.js'
