<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyNote IDE App</title>

    <!-- 1. Tailwind & Fonts -->
    <link rel="stylesheet" href="tailwind-compiled.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- 2. PyNote Stylesheets -->
    <link rel="stylesheet" href="https://python-web-ide.pages.dev/pynote-core.css">
    <link rel="stylesheet" href="https://python-web-ide.pages.dev/markdown-styles.css">

    <!-- 3. Third-Party Runtime Libraries -->
    <script src="https://python-web-ide.pages.dev/cm6.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/autosize.js/6.0.1/autosize.min.js"></script>
    
    <!-- NEW: Split.js for Resizable Panels -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.5/split.min.js"></script>

    <!-- 4. MathJax Setup -->
    <script>
        MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }, startup: { typeset: false } };
        if (typeof marked !== 'undefined' && marked.setOptions) marked.setOptions({ breaks: true });
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- 5. PyNote Core Scripts -->
    <script src="notebook-format.js"></script>
    <script src="notebook-generic.js"></script>
    <script src="text-cells.js"></script>
    <script src="markdown-cells.js"></script>
    <script src="code-cells.js"></script>
    <script src="markdown-widget-registry.js"></script>
    <script src="plugin-csv.js"></script>
    <script src="markdown-cells-embedded-code.js"></script>
    
    <style>
        /* Force App Layout */
        body { font-family: 'Inter', sans-serif; margin: 0; overflow: hidden !important; height: 100vh !important; width: 100vw !important; }
        
        /* Split.js Gutter Styling */
        .gutter { background-color: #f1f5f9; background-repeat: no-repeat; background-position: 50%; transition: background-color 0.2s; }
        .gutter:hover { background-color: #cbd5e1; }
        .gutter.gutter-horizontal { cursor: col-resize; border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; }
        
        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="flex flex-col bg-slate-50 text-slate-800">

    <!-- Hidden File Input for Loading -->
    <input type="file" id="file-upload" class="hidden" accept=".py,.txt,.json,.ipynb">

    <!-- TOP NAVBAR (Restored Dropdown Menu) -->
    <nav class="bg-slate-800 text-slate-200 flex items-center px-2 py-1 text-[13px] shrink-0 relative z-50 shadow-md font-sans select-none">
        <div class="font-bold px-3 text-white tracking-tight flex items-center gap-2">
            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
            PyNote
        </div>
        
        <!-- File Menu -->
        <div class="relative">
            <button id="menu-btn-file" class="menu-btn px-3 py-1 hover:bg-slate-700 hover:text-white rounded cursor-pointer outline-none">File</button>
            <div id="dropdown-file" class="dropdown-menu absolute left-0 mt-0 w-64 bg-white text-slate-800 border border-slate-200 shadow-xl rounded-md hidden py-1">
                <a href="#" id="menu-file-load" class="block px-4 py-1.5 hover:bg-blue-500 hover:text-white">Open Notebook...</a>
                <hr class="border-slate-200 my-1">
                <a href="#" id="menu-file-save-flat" class="block px-4 py-1.5 hover:bg-blue-500 hover:text-white flex justify-between">
                    <span>Save as .pynote.py</span> <span class="text-slate-400 text-[10px] mt-0.5">Flatfile</span>
                </a>
                <a href="#" id="menu-file-save-ipynb" class="block px-4 py-1.5 hover:bg-blue-500 hover:text-white flex justify-between">
                    <span>Save as .ipynb</span> <span class="text-slate-400 text-[10px] mt-0.5">Jupyter</span>
                </a>
                <hr class="border-slate-200 my-1">
                <a href="#" id="menu-file-save-moodle" class="block px-4 py-1.5 hover:bg-fuchsia-600 hover:text-white flex justify-between text-fuchsia-700 font-medium">
                    <span>Export to Moodle XML</span>
                </a>
            </div>
        </div>

        <!-- Settings Menu (Optional duplicate of RHS, kept for completeness) -->
        <div class="relative">
            <button id="menu-btn-settings" class="menu-btn px-3 py-1 hover:bg-slate-700 hover:text-white rounded cursor-pointer outline-none">Settings</button>
            <div id="dropdown-settings" class="dropdown-menu absolute left-0 mt-0 w-64 bg-white text-slate-800 border border-slate-200 shadow-xl rounded-md hidden py-1">
                <div class="px-4 py-1.5 text-xs text-slate-500">Use the right-hand panel to adjust live configuration.</div>
            </div>
        </div>
    </nav>

    <!-- 3-PANE WORKSPACE (Split.js Target) -->
    <div class="flex-1 flex overflow-hidden w-full h-full" id="split-container">
        
        <!-- LHS: FILE EXPLORER -->
        <aside id="lhs-panel" class="bg-white flex flex-col shrink-0 overflow-hidden">
            <div class="px-3 py-2 border-b border-slate-200 bg-slate-50 font-semibold text-xs text-slate-500 uppercase tracking-wider flex justify-between items-center shrink-0">
                <span>Files</span>
                <button onclick="document.getElementById('file-upload').click()" class="text-slate-400 hover:text-blue-500 transition-colors" title="Upload File">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </div>
            
            <div id="lhs-file-panel" class="flex-1 overflow-y-auto p-2">
                <div id="file-list" class="flex flex-col gap-0.5"></div>
                <div id="drop-indicator" class="hidden h-full flex-col items-center justify-center text-slate-400 border-2 border-dashed border-blue-300 rounded-lg bg-blue-50/50 m-2">
                    <span class="text-sm font-medium">Drop file here</span>
                </div>
            </div>
        </aside>

        <!-- MAIN: EDITOR AREA -->
        <main id="main-panel" class="bg-[#f3f4f6] flex flex-col relative overflow-hidden">
            
            <!-- Browser-Style Tab Bar -->
            <div class="bg-slate-200 flex items-end px-2 pt-2 gap-1 shrink-0 overflow-x-auto border-b border-slate-300 shadow-inner" id="tab-bar">
                <!-- Tabs injected by JS -->
            </div>
            
<!-- Scrollable Workspace -->
            <div class="flex-1 overflow-y-auto p-6 relative flex flex-col items-center w-full">
                <div class="w-full max-w-5xl bg-white border border-slate-200 rounded-md shadow-sm min-h-[500px] flex flex-col">
                    
                    <!-- THE MISSING TOP TOOLBAR -->
                    <header id="main-header" class="hidden bg-white border-b border-slate-200 px-4 py-2 flex justify-between items-center shrink-0 rounded-t-md transition-all">
                        <div class="flex items-center gap-3">
                            <div id="kernel-status-wrapper" class="flex items-center gap-1.5 text-[11px] font-medium text-slate-500 bg-slate-100 px-2 py-1 rounded-md tracking-wider border border-slate-200 shadow-inner">
                                <div id="kernel-status-indicator" class="flex items-center gap-1.5 uppercase min-w-[70px]">Starting...</div>
                                <div class="w-px h-3 bg-slate-300 mx-0.5"></div>
                                <select id="kernel-selector" onchange="document.getElementById('config-kernel').value = this.value; document.getElementById('config-kernel').dispatchEvent(new Event('change'));" class="bg-transparent border-none outline-none cursor-pointer font-bold text-slate-600 hover:text-slate-900 uppercase text-[10px] text-center appearance-none px-1">
                                    <option value="skulpt">Skulpt</option>
                                    <option value="pyodide">Pyodide</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="notebookCore.restartKernel()" class="flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-slate-600 bg-slate-100 border border-slate-200 rounded hover:bg-slate-200 transition-colors shadow-sm" title="Restart Kernel">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                Restart
                            </button>
                            <div class="w-px h-4 bg-slate-300 mx-1"></div>
                            <button id="run-all-btn" onclick="notebookCore.runAll()" class="flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-white bg-blue-600 rounded hover:bg-blue-700 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                                Run All
                            </button>
                        </div>
                    </header>

                    <!-- PyNote mounts here -->
                    <div id="pynote-mount-point" class="flex-1 p-2 pb-6 relative flex flex-col w-full box-border"></div>
                </div>
            </div>
        </main>

        <!-- RHS: CONFIGURATION PANEL -->
        <aside id="rhs-panel" class="bg-white flex flex-col shrink-0 overflow-hidden">
            <div class="px-3 py-2 border-b border-slate-200 bg-slate-50 font-semibold text-xs text-slate-500 uppercase tracking-wider shrink-0">
                Configuration
            </div>
            
            <div class="p-4 flex flex-col gap-4 text-sm overflow-y-auto">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Execution Kernel</label>
                    <select id="config-kernel" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded p-1.5">
                        <option value="skulpt">Skulpt (Fast)</option>
                        <option value="pyodide">Pyodide (Full CPython)</option>
                    </select>
                </div>
                
                <hr class="border-slate-100">

                <div class="flex flex-col gap-2.5">
                    <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" id="config-topbar" class="w-4 h-4 text-blue-600 rounded"><span>Show Top Toolbar</span></label>
                    <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" id="config-question" class="w-4 h-4 text-blue-600 rounded"><span>Enable Question Mode</span></label>
                    <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" id="config-readonly" class="w-4 h-4 text-blue-600 rounded"><span>Global Read-Only</span></label>
                    <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" id="config-noinsert" class="w-4 h-4 text-blue-600 rounded"><span>Disable Cell Insertion</span></label>
                    <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" id="config-nodelete" class="w-4 h-4 text-blue-600 rounded"><span>Disable Cell Deletion</span></label>
                </div>
            </div>
        </aside>

    </div>

    <script>
        // --- 0. LAYOUT & MENU LOGIC ---
        
        // Initialize Split.js (Resizable Panes)
        // sizes: percentages. minSize: pixels (collapses to 0 when dragged past threshold)
        const split = Split(['#lhs-panel', '#main-panel', '#rhs-panel'], {
            sizes: [18, 62, 20],
            minSize: [0, 400, 0],
            gutterSize: 6,
            snapOffset: 40 // Snaps panel shut if dragged to within 40px
        });

        // Dropdown Menu Logic
        const fileBtn = document.getElementById('menu-btn-file'), fileDropdown = document.getElementById('dropdown-file');
        const settingsBtn = document.getElementById('menu-btn-settings'), settingsDropdown = document.getElementById('dropdown-settings');

        function closeAllMenus() {
            fileDropdown.classList.add('hidden'); settingsDropdown.classList.add('hidden');
            fileBtn.classList.remove('bg-slate-700', 'text-white'); settingsBtn.classList.remove('bg-slate-700', 'text-white');
        }
        function toggleMenu(btn, dropdown, event) {
            event.stopPropagation(); const isHidden = dropdown.classList.contains('hidden');
            closeAllMenus();
            if (isHidden) { dropdown.classList.remove('hidden'); btn.classList.add('bg-slate-700', 'text-white'); }
        }
        fileBtn.onclick = (e) => toggleMenu(fileBtn, fileDropdown, e);
        settingsBtn.onclick = (e) => toggleMenu(settingsBtn, settingsDropdown, e);
        document.addEventListener('click', () => closeAllMenus());
        document.querySelectorAll('.dropdown-menu').forEach(menu => {
            menu.addEventListener('click', (e) => { if(e.target.tagName !== 'A') e.stopPropagation(); });
        });

        // --- 1. VIRTUAL FILE SYSTEM ---
        let virtualFS = {
            'main.pynote.py': `# %% [markdown]\n"""\n### Welcome to the PyNote IDE!\nUse the File Explorer to upload notebooks, and the right panel to test configurations.\n"""\n\n# %% [code]\nprint("Hello World!")`
        };
        let activeFileName = 'main.pynote.py';

        let currentOptions = {
            showTopBar: true, kernelType: 'skulpt', autocompleteMode: 'custom',
            questionMode: false, isReadOnly: false, disableInsertAll: false, disableDelete: false
        };

        // --- 2. RENDERING ENGINE ---
        
        function switchFile(newFileName) {
            if (activeFileName === newFileName) return;

            // 1. Save current state before switching
            if (window.notebookCore) {
                virtualFS[activeFileName] = window.notebookCore.serializeToFlat();
            }
            // 2. Switch pointer
            activeFileName = newFileName;
            // 3. Render new UI
            renderWorkspace();
        }

        function renderWorkspace() {
            // Save state if just a config update on the current file
            if (window.notebookCore && virtualFS[activeFileName]) {
                virtualFS[activeFileName] = window.notebookCore.serializeToFlat();
            }

            // Wipe the DOM container to ensure a clean slate
            const mountPoint = document.getElementById('pynote-mount-point');
            mountPoint.innerHTML = '';

            // Destroy and re-create notebook
            window.notebookCore = new NotebookCore('pynote-mount-point', currentOptions);
            const parsedCells = window.notebookCore.deserializeFromFlat(virtualFS[activeFileName] || '');
            window.notebookCore.loadData(parsedCells);
            
            updateFileListUI();
            updateTabBarUI();
        }

        window.triggerHostSync = function(flatfilePayload) {
            virtualFS[activeFileName] = flatfilePayload;
        };

        // --- 3. UI GENERATORS (Tabs & Files) ---

        function updateTabBarUI() {
            const tabBar = document.getElementById('tab-bar');
            tabBar.innerHTML = '';
            
            Object.keys(virtualFS).forEach(fileName => {
                const isActive = fileName === activeFileName;
                const tab = document.createElement('div');
                
                // Browser-tab styling
                tab.className = `flex items-center px-4 py-1.5 text-sm cursor-pointer select-none border-t border-x rounded-t-lg transition-colors ${
                    isActive 
                    ? 'bg-white border-slate-300 text-blue-600 font-medium translate-y-px z-10' 
                    : 'bg-slate-100 border-transparent text-slate-500 hover:bg-slate-50 border-b border-b-slate-300'
                }`;
                
                tab.innerHTML = `<svg class="w-4 h-4 mr-1.5 ${isActive ? 'text-blue-500' : 'text-slate-400'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> ${fileName}`;
                tab.onclick = () => switchFile(fileName);
                tabBar.appendChild(tab);
            });
        }

        function updateFileListUI() {
            const listEl = document.getElementById('file-list');
            listEl.innerHTML = '';
            
            Object.keys(virtualFS).forEach(fileName => {
                const isActive = fileName === activeFileName;
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-1.5 rounded text-sm truncate transition-colors flex items-center gap-2 ${isActive ? 'bg-blue-100 text-blue-700 font-medium' : 'hover:bg-slate-100 text-slate-600'}`;
                btn.innerHTML = `<svg class="w-4 h-4 shrink-0 ${isActive ? 'text-blue-500' : 'text-slate-400'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>${fileName}`;
                btn.onclick = () => switchFile(fileName);
                listEl.appendChild(btn);
            });
        }

        // --- 4. EXPORT MENU BINDINGS ---
        function downloadFile(filename, content) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
        }

        document.getElementById('menu-file-save-flat').onclick = (e) => { e.preventDefault(); downloadFile(activeFileName.replace('.ipynb', '') + '.pynote.py', window.notebookCore.serializeToFlat()); };
        document.getElementById('menu-file-save-ipynb').onclick = (e) => {
            e.preventDefault();
            const cells = window.notebookCore.toJSON().map(c => ({
                cell_type: c.type === 'code' ? 'code' : 'markdown',
                metadata: { pynote_locked: !!c.isLocked },
                source: c.content ? c.content.split('\n').map((l, i, arr) => l + (i === arr.length - 1 ? '' : '\n')) : [],
                ...(c.type === 'code' ? { execution_count: null, outputs: [] } : {})
            }));
            downloadFile(activeFileName.replace('.pynote.py', '') + '.ipynb', JSON.stringify({ cells, metadata: { language_info: { name: "python" } }, nbformat: 4, nbformat_minor: 5 }, null, 2));
        };
        // (Moodle XML logic remains identical to your previous implementation, omitted here for brevity to focus on layout)

        // --- 5. DRAG & DROP BINDINGS ---
        const dropZone = document.getElementById('lhs-file-panel'), dropInd = document.getElementById('drop-indicator'), fileList = document.getElementById('file-list');
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); fileList.classList.add('hidden'); dropInd.classList.remove('hidden'); dropInd.classList.add('flex'); });
        dropZone.addEventListener('dragleave', () => { fileList.classList.remove('hidden'); dropInd.classList.add('hidden'); dropInd.classList.remove('flex'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); fileList.classList.remove('hidden'); dropInd.classList.add('hidden'); dropInd.classList.remove('flex');
            if (e.dataTransfer.files.length) handleFileImport(e.dataTransfer.files[0]);
        });
        document.getElementById('file-upload').addEventListener('change', (e) => { if (e.target.files.length) handleFileImport(e.target.files[0]); e.target.value = ''; });

        function handleFileImport(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                let content = event.target.result;
                if (file.name.endsWith('.ipynb')) {
                    try {
                        const ipynb = JSON.parse(content);
                        content = ipynb.cells.map(c => `# %% [${c.cell_type === 'markdown' ? 'markdown' : 'code'}]\n${(Array.isArray(c.source) ? c.source.join('') : c.source || '').replace(/\\n+$/, '')}`).join('\n\n');
                    } catch (e) { alert("Invalid Jupyter Notebook"); return; }
                }
                virtualFS[file.name] = content;
                switchFile(file.name);
            };
            reader.readAsText(file);
        }

        // --- 6. RHS CONFIGURATION BINDINGS ---
        ['kernel', 'topbar', 'question', 'readonly', 'noinsert', 'nodelete'].forEach(key => {
            const el = document.getElementById('config-' + key);
            el.addEventListener('change', (e) => {
                const map = { kernel: 'kernelType', topbar: 'showTopBar', question: 'questionMode', readonly: 'isReadOnly', noinsert: 'disableInsertAll', nodelete: 'disableDelete' };
                currentOptions[map[key]] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
                renderWorkspace();
            });
        });

        // --- BOOTSTRAP ---
        renderWorkspace();
    </script>
</body>
</html>
