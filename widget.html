<!DOCTYPE html>
<html>
<head>
    <style>
        /* Fill the iframe */
        html, body { height: 100%; margin: 0; background: #ffffff; }
        body { padding: 10px; font-family: monospace; box-sizing: border-box; overflow: hidden; }
        
        /* The native textarea */
        textarea {
            width: 100%;
            height: 100%; /* Fill the body completely */
            margin: 0;
            padding: 8px;
            border: 1px dashed #cbd5e1; /* The dashed border so you can see it fills the space */
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
            resize: none; /* Disable manual drag, let the iframe parent resize it */
            overflow: hidden; /* Hide internal scrollbars, iframe expands instead */
            font-family: inherit;
            font-size: 14px;
            transition: opacity 0.3s;
            background: transparent;
        }

        .modal-overlay { display: flex; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.8); z-index: 50; align-items: center; justify-content: center; flex-direction: column; }
        .modal-content { background: white; padding: 1.5rem 2rem; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); text-align: center; font-family: sans-serif; border: 1px solid #e5e7eb; }
        .modal-content p { margin: 0 0 1rem 0; font-weight: bold; color: #ef4444; }
        .modal-content button { background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.25rem; font-weight: bold; cursor: pointer; }
        .spinner { border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid white; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; margin-left: 8px; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="error-modal" class="modal-overlay">
        <div class="modal-content">
            <p>Widget disconnected</p>
            <button id="reconnect-btn"><span id="btn-text">Try to connect</span><span id="btn-spinner" class="spinner"></span></button>
        </div>
    </div>
    
    <!-- Using a true textarea now -->
    <textarea id="editor" spellcheck="false" placeholder="// Loading..."></textarea>
    
    <script>
        const editor = document.getElementById('editor');
        const errorModal = document.getElementById('error-modal');
        const reconnectBtn = document.getElementById('reconnect-btn');
        let pendingSyncId = null, syncTimeout = null;

        function hashCode(str) {
            let hash = 0;
            for (let i = 0, len = str.length; i < len; i++) {
                hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
            }
            return hash.toString();
        }

        // Use readOnly instead of contenteditable
        function lockWidget() { editor.readOnly = true; editor.style.opacity = '0.5'; errorModal.style.display = 'flex'; }
        function unlockWidget() { editor.readOnly = false; editor.style.opacity = '1'; errorModal.style.display = 'none'; reconnectBtn.querySelector('.spinner').style.display = 'none'; reconnectBtn.disabled = false; reconnectBtn.querySelector('#btn-text').innerText = 'Try to connect'; }

        function sendHeight() {
            // Trick to measure actual text height: shrink to 1px, measure, restore to 100%
            editor.style.height = '1px';
            const contentHeight = editor.scrollHeight;
            editor.style.height = '100%';
            
            // Send height + 20px for body padding
            window.parent.postMessage({ type: 'SYNC_HEIGHT', payload: contentHeight + 20 }, '*');
        }

        function syncToServer() {
            // Use .value for textarea
            const content = editor.value;
            pendingSyncId = Date.now().toString() + Math.random().toString();
            window.parent.postMessage({ type: 'SYNC_CONTENT', payload: content, hash: hashCode(content), msgId: pendingSyncId }, '*');
            clearTimeout(syncTimeout);
            syncTimeout = setTimeout(lockWidget, 500);
        }

        editor.addEventListener('input', () => { syncToServer(); sendHeight(); });

        reconnectBtn.addEventListener('click', () => {
            reconnectBtn.querySelector('.spinner').style.display = 'inline-block';
            reconnectBtn.querySelector('#btn-text').innerText = 'Connecting...';
            reconnectBtn.disabled = true;
            if (editor.value === '') window.parent.postMessage({ type: 'REQUEST_CONTENT' }, '*');
            else syncToServer();
            syncTimeout = setTimeout(() => { unlockWidget(); lockWidget(); }, 1000);
        });

        window.addEventListener('message', (event) => {
            if (event.data.type === 'LOAD_CONTENT') {
                // Use .value for textarea
                editor.value = event.data.payload;
                if (event.data.config && event.data.config.isReadOnly) { editor.readOnly = true; errorModal.style.display = 'none'; }
                else unlockWidget();
                clearTimeout(syncTimeout);
                setTimeout(sendHeight, 50);
            } else if (event.data.type === 'ACK_CONTENT' && event.data.msgId === pendingSyncId) {
                if (event.data.hash === hashCode(editor.value)) { clearTimeout(syncTimeout); unlockWidget(); }
                else lockWidget();
            }
        });

        window.parent.postMessage({ type: 'REQUEST_CONTENT' }, '*');
        syncTimeout = setTimeout(lockWidget, 500);
        new ResizeObserver(sendHeight).observe(document.body);
    </script>
</body>
</html>
