<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Code Editor</title>
    
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

    <style>
        /* --- GENERAL LAYOUT --- */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2e2e2e; 
            color: #d4d4d4;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Warning/Sync Banner */
        #sync-banner {
            height: 35px;
            display: none; /* Hidden by default */
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background-color 0.3s ease;
        }
        
        #sync-banner.visible { display: flex; }
        #sync-banner.banner-warning { background-color: #a31515; color: white; }
        #sync-banner.banner-active { background-color: #28a745; color: white; }

        .btn-banner {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            margin-left: 15px;
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-banner:hover { background-color: rgba(255, 255, 255, 0.4); }

        /* Main Toolbar (Layout controls) */
        .main-toolbar {
            height: 40px;
            background-color: #333333;
            border-bottom: 1px solid #1e1e1e;
            display: flex;
            align-items: center;
            padding: 0 15px;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .main-title { font-weight: 600; color: #9cdcfe; font-size: 14px; }
        
        .toolbar-left {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .toolbar-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Container for Editor/Output/Resizer */
        .container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
            position: relative;
            /* Default to Vertical Split (row) */
            flex-direction: row; 
        }

        /* --- PANELS --- */
        #editor-wrapper, #output-wrapper {
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Flex basis handles sizing */
            flex-basis: 50%; 
            flex-grow: 1; 
            min-width: 0;
            min-height: 0;
        }

        /* Resizer Handle */
        .resizer {
            background-color: #444;
            flex-shrink: 0;
            z-index: 10;
            transition: background-color 0.2s;
        }
        .resizer:hover, .resizer.active { background-color: #0e639c; }

        /* Specifics for Vertical Split (Default) */
        .container.vertical-split { flex-direction: row; }
        .container.vertical-split .resizer {
            width: 8px;
            height: 100%;
            cursor: col-resize;
            border-left: 1px solid #111;
            border-right: 1px solid #111;
        }

        /* Specifics for Horizontal Split */
        .container.horizontal-split { flex-direction: column; }
        .container.horizontal-split .resizer {
            width: 100%;
            height: 8px;
            cursor: row-resize;
            border-top: 1px solid #111;
            border-bottom: 1px solid #111;
        }

        /* Specifics for Hidden Output */
        .container.output-hidden #output-wrapper { display: none; }
        .container.output-hidden .resizer { display: none; }
        .container.output-hidden #editor-wrapper { flex-basis: 100%; max-width: 100%; height: 100%; }
        
        /* Show the 'Show Output' button only when hidden */
        .btn-show-output { display: none; }
        .container.output-hidden .btn-show-output { display: inline-flex !important; }

        .panel-header {
            background-color: #252526;
            padding: 8px 15px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #cccccc;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        #custom-editor-container {
            display: flex;
            flex-grow: 1;
            position: relative;
            height: 100%;
            overflow: hidden; 
        }

        #line-numbers {
            width: 50px;
            height: 100%;
            background-color: #1e1e1e;
            border-right: 1px solid #333;
            text-align: right;
            padding: 15px 10px 15px 0; 
            box-sizing: border-box;
            color: #606060;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden;
            flex-shrink: 0;
            user-select: none;
        }

        #code-overlay-wrapper {
            flex-grow: 1;
            position: relative;
            height: 100%;
            overflow: hidden;
        }

        #highlighting, #editing {
            margin: 0;
            padding: 15px 5px; 
            border: 0;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            box-sizing: border-box;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            tab-size: 4;
            white-space: pre; 
            overflow: auto;
        }

        #highlighting {
            z-index: 1;
            background-color: #1e1e1e;
            pointer-events: none; 
        }
        #highlighting code { font-family: inherit; }

        #editing {
            z-index: 2;
            color: transparent;        
            background: transparent;  
            caret-color: #d4d4d4;     
            outline: none;
            resize: none;             
        }

        #editing::placeholder {
            color: #6a9955;
            font-style: italic;
            opacity: 0.6;
        }

        /* --- SYNTAX HIGHLIGHTING COLORS --- */
        .token-keyword  { color: #569cd6; } 
        .token-string   { color: #ce9178; } 
        .token-fstring  { color: #f44747; } 
        .token-comment  { color: #6a9955; font-style: italic; } 
        .token-number   { color: #b5cea8; } 
        .token-decorator{ color: #c586c0; } 

        /* --- TOOLBAR & OUTPUT --- */
        .toolbar {
            padding: 8px;
            background-color: #252526;
            border-bottom: 1px solid #333;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #cccccc;
            background-color: #3c3c3c;
        }
        button:hover { background-color: #4c4c4c; }

        .btn-run { background-color: #0e639c; color: white; }
        .btn-run:hover { background-color: #1177bb; }
        
        .btn-submit { background-color: #28a745; color: white; }
        .btn-submit:hover { background-color: #2fb94e; }
        
        .btn-share { background-color: #3c3c3c; color: #9cdcfe; }

        .btn-layout { background-color: #444; }

        .btn-sm {
            padding: 2px 8px; 
            font-size: 11px;
        }
        
        /* Specific style for the Show Output button in editor header */
        .btn-show-output {
            background-color: #0e639c;
            color: white;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 2px;
        }
        .btn-show-output:hover { background-color: #1177bb; }

        #output {
            flex-grow: 1;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-y: auto;
            color: #cccccc;
            background-color: #1e1e1e;
        }

        .output-error { color: #f48771; }
        .output-success { color: #4ec9b0; font-style: italic; font-size: 12px; margin-top: 10px; display: block; }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #424242; border-radius: 5px; }
    </style>
</head>
<body>

<div id="sync-banner">
    <span id="sync-banner-text"></span>
    <button id="btn-toggle-sync" class="btn-banner">Turn off</button>
</div>

<div class="main-toolbar">
    <div class="toolbar-left">
        <div class="main-title">PYTHON EDITOR</div>
        </div>
    <div class="toolbar-actions">
        <button class="btn-layout" onclick="toggleLayout()" title="Change Layout">
            <span id="layout-icon">◫</span> Layout
        </button>
        <button class="btn-run" onclick="runCode()">► Run Code</button>
        <button class="btn-submit" onclick="submitToMoodle()">Copy to Answer Box</button>
    </div>
</div>

<div class="container vertical-split" id="main-container">
    
    <div id="editor-wrapper">
        <div class="panel-header">
            <span>CODE</span>
            <button class="btn-show-output" onclick="showTerminal()">Show Output Panel</button>
        </div>
        <div id="custom-editor-container">
            <div id="line-numbers">1</div>
            <div id="code-overlay-wrapper">
                <pre id="highlighting" aria-hidden="true"><code id="highlighting-content"></code></pre>
                <textarea id="editing" spellcheck="false" placeholder="# try and test code here"
                    oninput="update(this.value); sync_scroll(this);" 
                    onscroll="sync_scroll(this);" 
                    onkeydown="handleKeyDown(event)"
                    onpaste="handlePaste(event)"></textarea>
            </div>
        </div>
    </div>

    <div class="resizer" id="resizer"></div>

    <div id="output-wrapper">
        <div class="panel-header">
            <span>OUTPUT</span>
            <div class="panel-controls">
                <button class="btn-sm btn-clear" onclick="clearOutput()">Clear Output</button>
                <button class="btn-sm" onclick="hideTerminal()">Hide Output Panel</button>
            </div>
        </div>

        <div id="output"></div>
    </div>
</div>
<script>
    // --- VARIABLES & SETUP ---
    // Support both standard query strings (?id=1) and cache-friendly hashes (#id=1)
    const queryParams = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const getParam = (key) => hashParams.get(key) || queryParams.get(key);

    const QUESTION_ID = getParam('id') || "default_question"; 

    const editing = document.getElementById('editing');
    const highlightingContent = document.getElementById('highlighting-content');
    const highlighting = document.getElementById('highlighting');
    const lineNumbers = document.getElementById('line-numbers');
    const shareBtn = document.getElementById('btn-share');
    const outputDiv = document.getElementById("output");
    
    // Layout Elements
    const container = document.getElementById('main-container');
    const editorWrapper = document.getElementById('editor-wrapper');
    const outputWrapper = document.getElementById('output-wrapper');
    const resizer = document.getElementById('resizer');
    const layoutIcon = document.getElementById('layout-icon');
    
    // Banner UI
    const syncBanner = document.getElementById('sync-banner');
    const syncBannerText = document.getElementById('sync-banner-text');
    const btnToggleSync = document.getElementById('btn-toggle-sync');

    const storageKey = "python_editor_" + QUESTION_ID;
    const dirtyKey = "python_dirty_" + QUESTION_ID;
    const layoutKey = "python_layout_" + QUESTION_ID;
    const autoSyncPrefKey = "python_editor_autosync_pref"; 
    
    let isDirty = false;
    let hostConnected = false;
    let autoSyncEnabled = false;
    let currentLineCount = 0;

    // --- NEW SAFE MODE CONFIGURATION & BUFFER VARIABLES ---
    let outputBuffer = [];
    let bufferedLineCount = 0;
    let bufferedCharCount = 0; // NEW: Tracks total string size in memory
    let isExecutionTerminated = false;

    // Dynamically inject Safe Mode checkbox into the output panel controls
    const panelControls = document.querySelector('.panel-controls');
    if (panelControls) {
        const safeModeLabel = document.createElement('label');
        safeModeLabel.style.cssText = 'display: none; align-items: center; gap: 5px; font-size: 11px; color: #cccccc; cursor: pointer; margin-right: 10px; user-select: none;';
        safeModeLabel.innerHTML = '<input type="checkbox" id="chk-safe-mode" checked style="cursor:pointer;"> Safe Mode';
        panelControls.insertBefore(safeModeLabel, panelControls.firstChild);
    }
    const chkSafeMode = document.getElementById('chk-safe-mode');

    // --- UNDO/REDO PRESERVING UTILS ---
    function insertTextAtCursor(textarea, text) {
        textarea.focus();
        if (!document.execCommand('insertText', false, text)) {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            textarea.value = textarea.value.substring(0, start) + text + textarea.value.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + text.length;
            update(textarea.value);
        }
    }

    function deleteSelectedText(textarea) {
        textarea.focus();
        if (!document.execCommand('delete', false, null)) {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            textarea.value = textarea.value.substring(0, start) + textarea.value.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start;
            update(textarea.value);
        }
    }

    // --- UTILS ---
    function generateHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash |= 0;
        }
        return hash;
    }

    // --- SYNC & BANNER LOGIC ---
    function updateBannerUI() {
        if (hostConnected && autoSyncEnabled) {
            syncBanner.className = 'banner-active visible';
            syncBannerText.innerText = 'Auto-copy to answer box active';
            btnToggleSync.innerText = 'Turn off';
            btnToggleSync.style.display = 'inline-block';
            btnToggleSync.onclick = () => { 
                autoSyncEnabled = false; 
                localStorage.setItem(autoSyncPrefKey, 'false');
                updateBannerUI(); 
            };
        } else if (isDirty) {
            syncBanner.className = 'banner-warning visible';
            syncBannerText.innerText = 'WARNING: CODE HAS BEEN UPDATED - REMEMBER TO COPY YOUR CODE INTO THE ANSWER BOX.';
            
            if (hostConnected) {
                btnToggleSync.innerText = 'Turn on auto-copy';
                btnToggleSync.style.display = 'inline-block';
                btnToggleSync.onclick = () => { 
                    autoSyncEnabled = true; 
                    localStorage.setItem(autoSyncPrefKey, 'true');
                    triggerAutoSync(); 
                    updateBannerUI(); 
                };
            } else {
                btnToggleSync.style.display = 'none';
            }
        } else {
            syncBanner.className = '';
        }
    }

    function pingHost() {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'moodle-ping' }, '*');
            setTimeout(() => {
                if (!hostConnected) {
                    console.log("Auto-sync ping failed. Host listener not detected.");
                    autoSyncEnabled = false;
                    updateBannerUI();
                }
            }, 2000);
        }
    }

    function triggerAutoSync() {
        if (hostConnected && autoSyncEnabled) {
            syncWithMoodle(editing.value, 'moodle-sync-code');
        }
    }

    // --- EDITOR LOGIC (HIGHLIGHTING & SYNC) ---
    function update(text, shouldMarkDirty = true) {
        let result_text = text;
        if(text[text.length-1] == "\n") result_text += " "; 
        
        highlightingContent.innerHTML = highlightPython(result_text);
        updateLineNumbers(text);
        sync_scroll(editing);
        
        if (shouldMarkDirty) {
            setDirty(true);
            if (hostConnected && autoSyncEnabled) {
                triggerAutoSync();
            }
        }
        localStorage.setItem(storageKey, text);
    }

    function setDirty(dirty) {
        if (isDirty === dirty) return; 
        isDirty = dirty;
        localStorage.setItem(dirtyKey, dirty ? "true" : "false");
        updateBannerUI();
    }

    function updateLineNumbers(text) {
        const lines = text.split('\n').length;
        if (lines !== currentLineCount) {
            lineNumbers.innerHTML = Array(lines).fill(0).map((_, i) => i + 1).join('<br>');
            currentLineCount = lines;
        }
    }

    function sync_scroll(element) {
        highlighting.scrollTop = element.scrollTop;
        highlighting.scrollLeft = element.scrollLeft;
        lineNumbers.scrollTop = element.scrollTop;
    }

    // --- SMART TYPING HELPERS ---
    function getLineIndent(text, index) {
        const lineStart = text.lastIndexOf('\n', index - 1) + 1;
        let i = lineStart;
        while (i < text.length && (text[i] === ' ' || text[i] === '\t')) {
            i++;
        }
        return text.substring(lineStart, i);
    }

    function findMatchingBracket(text, closeIndex) {
        const closeChar = text[closeIndex];
        const openChar = closeChar === ')' ? '(' : (closeChar === ']' ? '[' : '{');
        let depth = 1;
        for (let i = closeIndex - 1; i >= 0; i--) {
            const c = text[i];
            if (c === closeChar) depth++;
            else if (c === openChar) depth--;
            if (depth === 0) return i;
        }
        return null;
    }

    function analyzeLineBrackets(line) {
        let stack = [];
        let inString = false;
        let stringChar = null;
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (inString) {
                if (char === stringChar && line[i-1] !== '\\') inString = false;
                continue;
            }
            if (char === '"' || char === "'") {
                inString = true;
                stringChar = char;
                continue;
            }
            if (char === '#') break; 
            
            if (['(', '[', '{'].includes(char)) {
                stack.push({ char, index: i });
            } else if ([']', ')', '}'].includes(char)) {
                if (stack.length > 0) {
                    const last = stack[stack.length - 1];
                    if ((char === ']' && last.char === '[') ||
                        (char === ')' && last.char === '(') ||
                        (char === '}' && last.char === '{')) {
                        stack.pop();
                    }
                }
            }
        }
        return stack;
    }

    function handleKeyDown(e) {
        const textarea = e.target;
        const val = textarea.value;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;

        if(e.key == "Tab") {
            e.preventDefault();
            insertTextAtCursor(textarea, "    ");
        } 
        else if (e.key == "Backspace") {
            if (start === end && start > 0) {
                const lineStart = val.lastIndexOf('\n', start - 1) + 1;
                const textBeforeCursor = val.substring(lineStart, start);
                
                if (/^\s+$/.test(textBeforeCursor) && textBeforeCursor.length >= 4) {
                    const fourCharsBefore = val.substring(start - 4, start);
                    if (fourCharsBefore === "    ") {
                        e.preventDefault();
                        textarea.selectionStart = start - 4;
                        textarea.selectionEnd = start;
                        deleteSelectedText(textarea);
                    }
                }
            }
        }
        else if (e.key == "Enter") {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                runCode();
                return;
            }
            e.preventDefault();
            const lineStart = val.lastIndexOf('\n', start - 1) + 1;
            const currentLine = val.substring(lineStart, start);
            const trimmed = currentLine.trimEnd();
            
            let nextIndent = "";
            const bracketStack = analyzeLineBrackets(currentLine);
            const lineWithoutComment = currentLine.split('#')[0].trimEnd();

            if (bracketStack.length > 0) {
                const lastOpen = bracketStack[bracketStack.length - 1];
                nextIndent = " ".repeat(lastOpen.index + 1);
            }
            else if (lineWithoutComment.endsWith(":")) {
                const beforeColon = lineWithoutComment.slice(0, -1).trimEnd();
                const lastCharBeforeColon = beforeColon.charAt(beforeColon.length - 1);
                if ([')', ']', '}'].includes(lastCharBeforeColon)) {
                    const closeIndex = lineStart + currentLine.lastIndexOf(lastCharBeforeColon);
                    const openIndex = findMatchingBracket(val, closeIndex);
                    if (openIndex !== null) {
                        nextIndent = getLineIndent(val, openIndex) + "    ";
                    } else {
                        nextIndent = getLineIndent(val, start) + "    ";
                    }
                } else {
                    nextIndent = getLineIndent(val, start) + "    ";
                }
            }
            else if ([')', ']', '}'].includes(trimmed.charAt(trimmed.length - 1))) {
                const lastChar = trimmed.charAt(trimmed.length - 1);
                const closeIndex = lineStart + currentLine.lastIndexOf(lastChar);
                const openIndex = findMatchingBracket(val, closeIndex);
                if (openIndex !== null) {
                    nextIndent = getLineIndent(val, openIndex);
                } else {
                    nextIndent = getLineIndent(val, start);
                }
            }
            else {
                 nextIndent = getLineIndent(val, start);
            }

            const insertion = "\n" + nextIndent;
            insertTextAtCursor(textarea, insertion);
            
            setTimeout(() => {
                sync_scroll(textarea);
            }, 0);
        }
    }

    function handlePaste(e) {
        const clipboardData = e.clipboardData || window.clipboardData;
        if (!clipboardData) return;
        e.preventDefault();

        let html = clipboardData.getData('text/html');
        let text = clipboardData.getData('text');

        if (html && html.trim().length > 0) {
            let processed = html.replace(/<style([\s\S]*?)<\/style>/gi, '');
            processed = processed.replace(/<script([\s\S]*?)<\/script>/gi, '');
            processed = processed.replace(/(<[a-z0-9]+)\s+[^>]+(?=>)/gi, '$1');
            processed = processed.replace(/<br\s*\/?>/gi, "\n");
            processed = processed.replace(/<\/div>/ig, '\n');
            processed = processed.replace(/<\/p>/ig, '\n');
            processed = processed.replace(/<\/li>/ig, '\n');
            processed = processed.replace(/<li>/ig, '  * ');
            processed = processed.replace(/<\/ul>/ig, '\n');
            processed = processed.replace(/<[^>]+>/ig, '');
            
            text = processed
                .replace(/&nbsp;/g, ' ')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&amp;/g, '&')
                .replace(/&quot;/g, '"')
                .replace(/&#39;/g, "'");

            text = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
            text = text.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "");

            const rawPlainText = clipboardData.getData('text') || "";
            if (rawPlainText) {
                if (!/^\s/.test(rawPlainText)) text = text.trimStart();
                if (!/\s$/.test(rawPlainText)) text = text.trimEnd();
            } else {
                text = text.trimEnd();
            }
        } else if (text) {
            text = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
            text = text.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "");
        }

        if (text) {
            insertTextAtCursor(editing, text);
            sync_scroll(editing);
        }
    }
        
    // --- SYNTAX HIGHLIGHTING ---
    function unescapeHtml(text) {
        return text.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
    }

    function highlightPython(code) {
        code = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const tokenRegex = /((?:#).*?$)|((?:\b[fF])?(?:"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'))|\b(def|class|import|from|return|if|else|elif|while|for|in|print|try|except|raise|True|False|None|as|with|finally|yield|lambda|pass|break|continue|and|or|not|is|self)\b|(\b\d+\b)|(@\w+)/gm;
        
        return code.replace(tokenRegex, function(match, comment, string, keyword, number, decorator) {
            if (comment) return `<span class="token-comment">${comment}</span>`;
            if (string) {
                if (string.startsWith('f') || string.startsWith('F')) {
                    const formattedString = string.replace(/\{.*?\}/g, function(interp) {
                        const inner = interp.slice(1, -1);
                        return `<span style="color: #d4d4d4;">{${highlightPython(unescapeHtml(inner))}}</span>`;
                    });
                    return `<span class="token-fstring">${formattedString}</span>`; 
                }
                return `<span class="token-string">${string}</span>`;
            }
            if (keyword) return `<span class="token-keyword">${keyword}</span>`;
            if (number) return `<span class="token-number">${number}</span>`;
            if (decorator) return `<span class="token-decorator">${decorator}</span>`;
            return match;
        });
    }

    // --- LAYOUT & RESIZING LOGIC ---
    let layoutMode = 0; 
    
    function toggleLayout(forceMode = -1) {
        if (forceMode !== -1) {
            layoutMode = parseInt(forceMode);
        } else {
            layoutMode = (layoutMode + 1) % 3;
        }

        localStorage.setItem(layoutKey, layoutMode);

        container.className = "container";
        editorWrapper.style.flexBasis = "";
        outputWrapper.style.flexBasis = "";
        editorWrapper.style.height = ""; 
        outputWrapper.style.height = "";
        editorWrapper.style.width = ""; 
        outputWrapper.style.width = "";

        if (layoutMode === 0) {
            container.classList.add("vertical-split");
            layoutIcon.innerText = "◫"; 
            resizer.style.display = "block";
        } else if (layoutMode === 1) {
            container.classList.add("horizontal-split");
            layoutIcon.innerText = "☰"; 
            resizer.style.display = "block";
        } else {
            container.classList.add("output-hidden");
            layoutIcon.innerText = "□"; 
        }
    }
    
    function hideTerminal() { toggleLayout(2); }
    function showTerminal() { toggleLayout(0); }

    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        resizer.classList.add('active');
        document.body.style.cursor = layoutMode === 0 ? 'col-resize' : 'row-resize';
        e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const containerRect = container.getBoundingClientRect();
        
        if (layoutMode === 0) {
            let x = e.clientX - containerRect.left;
            let percent = (x / containerRect.width) * 100;
            if (percent < 10) percent = 10;
            if (percent > 90) percent = 90;
            
            editorWrapper.style.flexBasis = percent + '%';
            outputWrapper.style.flexBasis = (100 - percent) + '%';
        } else if (layoutMode === 1) {
            let y = e.clientY - containerRect.top;
            let percent = (y / containerRect.height) * 100;
             if (percent < 10) percent = 10;
             if (percent > 90) percent = 90;

             editorWrapper.style.flexBasis = percent + '%';
             outputWrapper.style.flexBasis = (100 - percent) + '%';
        }
    });

    document.getElementById('editor-wrapper').addEventListener('mouseenter', () => {
        if (document.activeElement !== editing) {
            editing.focus({ preventScroll: true });
        }
    });

    document.addEventListener('mouseup', () => {
        if (isResizing) {
            isResizing = false;
            resizer.classList.remove('active');
            document.body.style.cursor = 'default';
        }
    });

    // --- SKULPT EXECUTION (WITH SAFE BUFFERING & TIMEOUTS) ---
    function outf(text) { 
        if (isExecutionTerminated) return;

        outputBuffer.push(text);
        
        // Track lines and total string size (pseudo-memory protection)
        bufferedLineCount += (text.match(/\n/g) || []).length;
        bufferedCharCount += text.length;

        if (chkSafeMode && chkSafeMode.checked) {
            // Check for both Line limits and Byte/Character limits
            if (bufferedLineCount > 100 || bufferedCharCount > 50000) {
                isExecutionTerminated = true;
                flushBufferToScreen();
                
                var s = document.createElement('span');
                s.className = 'output-error';
                
                if (bufferedLineCount > 100) {
                    s.innerText = "\n\n[Safe Mode Error]: Code terminated. Generated output exceeded 100 lines.";
                } else {
                    s.innerText = "\n\n[Safe Mode Error]: Code terminated. Output exceeded memory limits (50,000 characters).";
                }
                
                outputDiv.appendChild(s);
                outputDiv.scrollTop = outputDiv.scrollHeight;
                
                throw new Error("Output limit exceeded");
            }
        }
    } 

    function builtinRead(x) {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) throw "Err";
        return Sk.builtinFiles["files"][x];
    }
    
    function flushBufferToScreen() {
        if (outputBuffer.length > 0) {
            var span = document.createElement('span');
            span.innerText = outputBuffer.join("");
            outputDiv.appendChild(span);
            outputBuffer = [];
        }
    }
    
    function runCode() { 
        outputDiv.innerHTML = "";
        outputBuffer = [];
        bufferedLineCount = 0;
        bufferedCharCount = 0;
        isExecutionTerminated = false;
        
        if (typeof Sk === 'undefined') {
            var s = document.createElement('span');
            s.className = 'output-error';
            s.innerText = "\nError: Python engine is still loading. Please try again in a moment.";
            outputDiv.appendChild(s);
            return;
        }

        if (layoutMode === 2) {
            toggleLayout(0);
        }

        setTimeout(() => {
            const isSafeMode = chkSafeMode && chkSafeMode.checked;

            Sk.configure({ 
                output: outf, 
                read: builtinRead, 
                __future__: Sk.python3,
                execLimit: isSafeMode ? 1000 : Number.POSITIVE_INFINITY 
            }); 
            
            Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, editing.value, true))
            .then(() => {
                if (isExecutionTerminated) return;
                flushBufferToScreen();

                var s = document.createElement('span');
                s.className = 'output-success';
                s.innerText = "\n>>> Finished successfully.";
                outputDiv.appendChild(s);
                outputDiv.scrollTop = outputDiv.scrollHeight;
            }, (err) => {
                if (isExecutionTerminated) return;
                flushBufferToScreen();

                var s = document.createElement('span');
                s.className = 'output-error';
                
                if (err.toString().includes("TimeLimitError")) {
                    s.innerText = "\n\n[Safe Mode Error]: Time limit exceeded. Execution timed out after 1.0 second.";
                } else {
                    s.innerText = "\n" + err.toString();
                }
                
                outputDiv.appendChild(s);
                outputDiv.scrollTop = outputDiv.scrollHeight;
            });
        }, 150);
    }

    function clearOutput() { outputDiv.innerHTML = ""; }

    function shareCode() {
        const code = editing.value;
        const base64Code = btoa(encodeURIComponent(code));
        let baseUrl = window.location.href.split('?')[0].split('#')[0];
        const shareUrl = baseUrl + '#code=' + base64Code;

        const tempInput = document.createElement("textarea");
        tempInput.value = shareUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
            document.execCommand("copy");
        } catch (e) {
            console.error("Clipboard copy failed");
        }
        document.body.removeChild(tempInput);

        const oldText = shareBtn.innerText;
        shareBtn.innerText = "✓ Link Copied";
        setTimeout(() => shareBtn.innerText = "Share Link", 1000);
    }

    function syncWithMoodle(code, type = 'moodle-submit-code') {
        if (window.parent && window.parent !== window) {
            const currentHash = generateHash(code);
            window.parent.postMessage({ type: type, content: code, hash: currentHash }, '*');
        }
    }
    
    function submitToMoodle() {
        const code = editing.value;
        syncWithMoodle(code, 'moodle-submit-code');

        const tempInput = document.createElement("textarea");
        tempInput.value = code;
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
            document.execCommand("copy");
            const btn = document.querySelector('.btn-submit');
            const oldText = btn.innerText;
            btn.innerText = "✓ Copied";
            setTimeout(() => { if (btn.innerText === "✓ Copied") btn.innerText = oldText; }, 1000);
        } catch (e) {
            console.error("Clipboard copy failed");
        }
        document.body.removeChild(tempInput);
        
        if (!hostConnected) {
            setDirty(false); 
        }
    }

    // --- PASTE EVENT LISTENER (FROM PARENT WINDOW) ---
    window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'moodle-pong') {
            hostConnected = true;
            const savedPref = localStorage.getItem(autoSyncPrefKey);
            autoSyncEnabled = (savedPref !== 'false'); 
            updateBannerUI();
        }

        if (e.data && e.data.type === 'moodle-sync-ack') {
            const currentHash = generateHash(editing.value);
            if (e.data.hash === currentHash) {
                setDirty(false); 
                if (!autoSyncEnabled) {
                    const btn = document.querySelector('.btn-submit');
                    const oldText = btn.innerText;
                    btn.innerText = "✓ Synced to Host";
                    btn.style.backgroundColor = "#218838"; 
                    setTimeout(() => { 
                        if (btn.innerText === "✓ Synced to Host") {
                            btn.innerText = oldText;
                            btn.style.backgroundColor = ""; 
                        }
                    }, 2000);
                }
            }
        }

        if (e.data && e.data.type === 'insert_starter_code') {
            const text = e.data.text;
            if (typeof text === 'string') {
                insertTextAtCursor(editing, text);
                sync_scroll(editing);
            }
        }
    });
    
    // --- INIT ---
    window.addEventListener('load', function() {
        requestAnimationFrame(() => {
            setTimeout(() => {
                const codeParam = getParam('code');
                if (codeParam) {
                    try {
                        const decodedCode = decodeURIComponent(atob(codeParam));
                        editing.value = decodedCode;
                        update(decodedCode, false);
                        setDirty(false);
                    } catch (e) { console.error(e); }
                } else {
                    const savedCode = localStorage.getItem(storageKey);
                    const savedDirty = localStorage.getItem(dirtyKey);

                    if (savedCode && savedCode.trim() !== "") {
                        editing.value = savedCode;
                        update(savedCode, false);
                    } else {
                        update(editing.value, false);
                    }

                    if (savedDirty === "true") {
                        setDirty(true);
                    } else {
                        setDirty(false);
                    }
                }
                
                const savedLayout = localStorage.getItem(layoutKey);
                if (savedLayout !== null) {
                    toggleLayout(parseInt(savedLayout));
                }

                pingHost();
            }, 10);
        });
    });
</script>
