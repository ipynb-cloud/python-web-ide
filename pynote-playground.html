<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyNote Native Integration with Menu</title>

    <!-- 1. Tailwind & Fonts -->
    <link rel="stylesheet" href="tailwind-compiled.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- 2. PyNote Stylesheets -->
    <link rel="stylesheet" href="https://python-web-ide.pages.dev/pynote-core.css">
    <link rel="stylesheet" href="https://python-web-ide.pages.dev/markdown-styles.css">

    <!-- 3. Third-Party Runtime Libraries -->
    <!-- Make sure your locally built cm6.bundle.min.js is used here! -->
    <script src="https://python-web-ide.pages.dev/cm6.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/autosize.js/6.0.1/autosize.min.js"></script>

    <!-- 4. MathJax Setup -->
    <script>
        MathJax = {
          tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
          startup: { typeset: false }
        };
        if (typeof marked !== 'undefined' && marked.setOptions) marked.setOptions({ breaks: true });
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- 5. PyNote Core Scripts (Ensure these are in the same folder) -->
    <script src="notebook-format.js"></script>
    <script src="notebook-generic.js"></script>
    <script src="text-cells.js"></script>
    <script src="markdown-cells.js"></script>
    <script src="code-cells.js"></script>
    <script src="markdown-widget-registry.js"></script>
    <script src="plugin-csv.js"></script>
    <script src="markdown-cells-embedded-code.js"></script>
    
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; }
        .demo-container { max-width: 900px; margin: 40px auto; background: white; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow: hidden; }
        .data-output { max-width: 900px; margin: 20px auto; }
        .data-output textarea { width: 100%; height: 200px; padding: 10px; font-family: 'Fira Code', monospace; font-size: 13px; background: #1e1e1e; color: #d4d4d4; border-radius: 6px; resize: vertical; }
    </style>
</head>
<body>

    <!-- Hidden File Input for Loading -->
    <input type="file" id="file-upload" class="hidden" accept=".py,.txt,.json">

    <!-- Native Tailwind Menu Bar -->
    <nav class="bg-slate-800 text-slate-200 flex items-center px-2 py-1 text-[13px] relative z-50 shadow-md font-sans select-none">
        <div class="font-bold px-3 text-white tracking-tight">PyNote</div>
        
        <!-- File Menu -->
        <div class="relative group">
            <button class="px-3 py-1 hover:bg-slate-700 hover:text-white rounded cursor-default outline-none">File</button>
            <div class="absolute left-0 mt-0 w-56 bg-white text-slate-800 border border-slate-200 shadow-xl rounded-md hidden group-hover:block py-1">
                <a href="#" id="menu-file-load" class="block px-4 py-1.5 hover:bg-blue-500 hover:text-white">Open Notebook...</a>
                <hr class="border-slate-200 my-1">
                <a href="#" id="menu-file-save-flat" class="block px-4 py-1.5 hover:bg-blue-500 hover:text-white flex justify-between">
                    <span>Save as .pynote.py</span> <span class="text-slate-400 text-[10px] mt-0.5">Flatfile</span>
                </a>
                <a href="#" id="menu-file-save-json" class="block px-4 py-1.5 hover:bg-blue-500 hover:text-white flex justify-between">
                    <span>Save as .json</span> <span class="text-slate-400 text-[10px] mt-0.5">Data</span>
                </a>
            </div>
        </div>

        <!-- Settings Menu -->
        <div class="relative group">
            <button class="px-3 py-1 hover:bg-slate-700 hover:text-white rounded cursor-default outline-none">Settings</button>
            <div class="absolute left-0 mt-0 w-64 bg-white text-slate-800 border border-slate-200 shadow-xl rounded-md hidden group-hover:block py-1">
                <a href="#" id="menu-setting-question" class="block px-4 py-1.5 hover:bg-blue-500 hover:text-white flex items-center justify-between">
                    <span>Question Mode (Lock UI)</span>
                    <span id="check-question" class="text-blue-500 font-bold hidden">✓</span>
                </a>
                <a href="#" id="menu-setting-readonly" class="block px-4 py-1.5 hover:bg-blue-500 hover:text-white flex items-center justify-between">
                    <span>Read Only</span>
                    <span id="check-readonly" class="text-blue-500 font-bold hidden">✓</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- The DOM Container for PyNote -->
    <div class="demo-container">
        <!-- This is where the notebook will mount -->
        <main class="p-4" id="pynote-mount-point"></main>
    </div>

    <!-- For demonstration: displaying the output data -->
    <div class="data-output">
        <div class="flex justify-between items-end mb-2">
            <p class="text-sm text-slate-500 font-bold">Live Server Payload Output:</p>
            <span id="sync-status" class="text-xs font-bold text-emerald-500 opacity-0 transition-opacity duration-300">Autosaved!</span>
        </div>
        <textarea id="output-console" readonly></textarea>
    </div>

    <script>
        // --- 1. CORE INITIALIZATION ---
        
        let currentOptions = {
            showTopBar: true,
            kernelType: 'skulpt',
            autocompleteMode: 'custom',
            questionMode: false,
            isReadOnly: false
        };

        function initNotebook(payloadStr) {
            // Re-instantiate over the existing DOM element
            window.notebookCore = new NotebookCore('pynote-mount-point', currentOptions);
            const parsedCells = window.notebookCore.deserializeFromFlat(payloadStr);
            window.notebookCore.loadData(parsedCells);
            
            // Sync initial state to the textarea
            window.triggerHostSync(window.notebookCore.serializeToFlat());
        }

        // --- 2. DATA BINDING ---
        
        // When a user types in a cell, PyNote automatically calls this function.
        window.triggerHostSync = function(flatfilePayload) {
            document.getElementById('output-console').value = flatfilePayload;
            
            // Flash the autosave indicator
            const statusIndicator = document.getElementById('sync-status');
            statusIndicator.style.opacity = '1';
            setTimeout(() => statusIndicator.style.opacity = '0', 1500);
        };

        // --- 3. MENU BAR LOGIC: FILES ---
        
        function downloadFile(filename, content) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        }

        document.getElementById('menu-file-save-flat').onclick = (e) => {
            e.preventDefault();
            downloadFile('notebook.pynote.py', window.notebookCore.serializeToFlat());
        };

        document.getElementById('menu-file-save-json').onclick = (e) => {
            e.preventDefault();
            const jsonData = JSON.stringify(window.notebookCore.toJSON(), null, 2);
            downloadFile('notebook.json', jsonData);
        };

        const fileInput = document.getElementById('file-upload');
        document.getElementById('menu-file-load').onclick = (e) => {
            e.preventDefault();
            fileInput.click();
        };

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const content = event.target.result;
                let parsedCells;
                
                try {
                    // See if it's a JSON export
                    parsedCells = JSON.parse(content);
                } catch (err) {
                    // Otherwise parse as flatfile
                    parsedCells = window.notebookCore.deserializeFromFlat(content);
                }
                
                window.notebookCore.loadData(parsedCells);
                window.triggerHostSync(window.notebookCore.serializeToFlat());
                fileInput.value = ''; 
            };
            reader.readAsText(file);
        });

        // --- 4. MENU BAR LOGIC: SETTINGS ---

        function toggleConfiguration(settingKey) {
            const currentData = window.notebookCore.serializeToFlat();
            currentOptions[settingKey] = !currentOptions[settingKey];
            
            // Re-render the UI with new settings
            initNotebook(currentData);
            
            // Update the checkmarks in the menu
            document.getElementById('check-question').classList.toggle('hidden', !currentOptions.questionMode);
            document.getElementById('check-readonly').classList.toggle('hidden', !currentOptions.isReadOnly);
        }

        document.getElementById('menu-setting-question').onclick = (e) => { e.preventDefault(); toggleConfiguration('questionMode'); };
        document.getElementById('menu-setting-readonly').onclick = (e) => { e.preventDefault(); toggleConfiguration('isReadOnly'); };


        // --- 5. BOOTSTRAP DEFAULT CONTENT ---
        
        const initialData = `# %% [markdown]
"""
### Welcome to PyNote! 🚀
This demonstrates how to initialize PyNote as a standard JavaScript component without any iframes, complete with a native File/Settings menu.
"""

# %% [code]
# Try editing this code. The flatfile string below will update automatically!
print("PyNote is running natively!")
`;

        // Boot it up!
        initNotebook(initialData);

    </script>
</body>
</html>
