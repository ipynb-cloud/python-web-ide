<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyNote Native Integration</title>

    <!-- 1. Tailwind & Fonts -->
    <link rel="stylesheet" href="tailwind-compiled.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- 2. PyNote Stylesheets -->
    <link rel="stylesheet" href="https://python-web-ide.pages.dev/pynote-core.css">
    <link rel="stylesheet" href="https://python-web-ide.pages.dev/markdown-styles.css">

    <!-- 3. Third-Party Runtime Libraries -->
    <script src="https://python-web-ide.pages.dev/cm6.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/autosize.js/6.0.1/autosize.min.js"></script>

    <!-- 4. MathJax Setup -->
    <script>
        MathJax = {
          tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
          startup: { typeset: false }
        };
        if (typeof marked !== 'undefined' && marked.setOptions) marked.setOptions({ breaks: true });
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- 5. PyNote Core Scripts -->
    <script src="notebook-format.js"></script>
    <script src="notebook-generic.js"></script>
    <script src="text-cells.js"></script>
    <script src="markdown-cells.js"></script>
    <script src="code-cells.js"></script>
    <script src="markdown-widget-registry.js"></script>
    <script src="plugin-csv.js"></script>
    <script src="markdown-cells-embedded-code.js"></script>
    
    <style>
        body { 
            background: #f8fafc; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow: auto !important; /* Overrides the Moodle CSS lock */
            height: auto !important;   /* Overrides the Moodle CSS lock */
        }
        .demo-container { max-width: 900px; margin: 40px auto; background: white; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow: hidden; }
        .data-output { max-width: 900px; margin: 20px auto; }
        .data-output textarea { width: 100%; height: 200px; padding: 10px; font-family: 'Fira Code', monospace; font-size: 13px; background: #1e1e1e; color: #d4d4d4; border-radius: 6px; resize: vertical; }
    </style>
</head>
<body>

    <!-- Hidden File Input for Loading -->
    <input type="file" id="file-upload" class="hidden" accept=".py,.txt,.json,.ipynb">

    <!-- Native Tailwind Menu Bar -->
    <nav class="bg-slate-800 text-slate-200 flex items-center px-2 py-1 text-[13px] relative z-50 shadow-md font-sans select-none">
        <div class="font-bold px-3 text-white tracking-tight">PyNote</div>
        
        <!-- File Menu -->
        <div class="relative">
            <button id="menu-btn-file" class="menu-btn px-3 py-1 hover:bg-slate-700 hover:text-white rounded cursor-pointer outline-none">File</button>
            <div id="dropdown-file" class="dropdown-menu absolute left-0 mt-0 w-64 bg-white text-slate-800 border border-slate-200 shadow-xl rounded-md hidden py-1">
                <a href="#" id="menu-file-load" class="block px-4 py-1.5 hover:bg-blue-500 hover:text-white">Open Notebook...</a>
                <hr class="border-slate-200 my-1">
                <a href="#" id="menu-file-save-flat" class="block px-4 py-1.5 hover:bg-blue-500 hover:text-white flex justify-between">
                    <span>Save as .pynote.py</span> <span class="text-slate-400 text-[10px] mt-0.5">Flatfile</span>
                </a>
                <a href="#" id="menu-file-save-ipynb" class="block px-4 py-1.5 hover:bg-blue-500 hover:text-white flex justify-between">
                    <span>Save as .ipynb</span> <span class="text-slate-400 text-[10px] mt-0.5">Jupyter</span>
                </a>
                <hr class="border-slate-200 my-1">
                <a href="#" id="menu-file-save-moodle" class="block px-4 py-1.5 hover:bg-fuchsia-600 hover:text-white flex justify-between text-fuchsia-700 font-medium">
                    <span>Export to Moodle XML</span>
                </a>
            </div>
        </div>

        <!-- Settings Menu -->
        <div class="relative">
            <button id="menu-btn-settings" class="menu-btn px-3 py-1 hover:bg-slate-700 hover:text-white rounded cursor-pointer outline-none">Settings</button>
            <div id="dropdown-settings" class="dropdown-menu absolute left-0 mt-0 w-64 bg-white text-slate-800 border border-slate-200 shadow-xl rounded-md hidden py-1">
                <a href="#" id="menu-setting-question" class="block px-4 py-1.5 hover:bg-blue-500 hover:text-white flex items-center justify-between">
                    <span>Question Mode (Lock UI)</span>
                    <span id="check-question" class="text-blue-500 font-bold hidden">✓</span>
                </a>
                <a href="#" id="menu-setting-readonly" class="block px-4 py-1.5 hover:bg-blue-500 hover:text-white flex items-center justify-between">
                    <span>Read Only</span>
                    <span id="check-readonly" class="text-blue-500 font-bold hidden">✓</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- The DOM Container for PyNote -->
    <div class="demo-container">
        <main class="p-4" id="pynote-mount-point"></main>
    </div>

    <!-- For demonstration: displaying the output data -->
    <div class="data-output">
        <div class="flex justify-between items-end mb-2">
            <p class="text-sm text-slate-500 font-bold">Live Server Payload Output:</p>
            <span id="sync-status" class="text-xs font-bold text-emerald-500 opacity-0 transition-opacity duration-300">Autosaved!</span>
        </div>
        <textarea id="output-console" readonly></textarea>
    </div>

    <script>
        // --- 0. MENU TOGGLE LOGIC ---
        const fileBtn = document.getElementById('menu-btn-file');
        const fileDropdown = document.getElementById('dropdown-file');
        const settingsBtn = document.getElementById('menu-btn-settings');
        const settingsDropdown = document.getElementById('dropdown-settings');

        function closeAllMenus() {
            fileDropdown.classList.add('hidden');
            settingsDropdown.classList.add('hidden');
            fileBtn.classList.remove('bg-slate-700', 'text-white');
            settingsBtn.classList.remove('bg-slate-700', 'text-white');
        }

        function toggleMenu(btn, dropdown, event) {
            event.stopPropagation();
            const isHidden = dropdown.classList.contains('hidden');
            closeAllMenus();
            if (isHidden) {
                dropdown.classList.remove('hidden');
                btn.classList.add('bg-slate-700', 'text-white');
            }
        }

        fileBtn.onclick = (e) => toggleMenu(fileBtn, fileDropdown, e);
        settingsBtn.onclick = (e) => toggleMenu(settingsBtn, settingsDropdown, e);
        document.addEventListener('click', () => closeAllMenus());
        document.querySelectorAll('.dropdown-menu').forEach(menu => {
            menu.addEventListener('click', (e) => { if(e.target.tagName !== 'A') e.stopPropagation(); });
        });

        // --- 1. CORE INITIALIZATION ---
        let currentOptions = {
            showTopBar: true,
            kernelType: 'skulpt',
            autocompleteMode: 'custom',
            questionMode: false,
            isReadOnly: false
        };

        function initNotebook(payloadStr) {
            window.notebookCore = new NotebookCore('pynote-mount-point', currentOptions);
            const parsedCells = window.notebookCore.deserializeFromFlat(payloadStr);
            window.notebookCore.loadData(parsedCells);
            window.triggerHostSync(window.notebookCore.serializeToFlat());
        }

        // --- 2. DATA BINDING ---
        window.triggerHostSync = function(flatfilePayload) {
            document.getElementById('output-console').value = flatfilePayload;
            const statusIndicator = document.getElementById('sync-status');
            statusIndicator.style.opacity = '1';
            setTimeout(() => statusIndicator.style.opacity = '0', 1500);
        };

        // --- 3. EXPORT LOGIC ---
        function downloadFile(filename, content) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        }

        document.getElementById('menu-file-save-flat').onclick = (e) => {
            e.preventDefault();
            downloadFile('notebook.pynote.py', window.notebookCore.serializeToFlat());
        };

        // Export to Jupyter .ipynb
        document.getElementById('menu-file-save-ipynb').onclick = (e) => {
            e.preventDefault();
            const pynoteCells = window.notebookCore.toJSON();
            const jupyterCells = pynoteCells.map(c => {
                const isCode = c.type === 'code';
                // Jupyter expects arrays of strings with trailing newlines
                const sourceArray = c.content ? c.content.split('\n').map((line, i, arr) => line + (i === arr.length - 1 ? '' : '\n')) : [];
                return {
                    cell_type: isCode ? 'code' : 'markdown',
                    metadata: { pynote_locked: !!c.isLocked },
                    source: sourceArray,
                    ...(isCode ? { execution_count: null, outputs: [] } : {})
                };
            });

            const ipynb = {
                cells: jupyterCells,
                metadata: { language_info: { name: "python" } },
                nbformat: 4,
                nbformat_minor: 5
            };
            
            downloadFile('notebook.ipynb', JSON.stringify(ipynb, null, 2));
        };

        // Export to Moodle XML
        document.getElementById('menu-file-save-moodle').onclick = (e) => {
            e.preventDefault();
            const flatData = window.notebookCore.serializeToFlat();
            
            // Protect CDATA closing tags just in case they appear in student code
            const safeFlatData = flatData.replace(/]]>/g, ']]]]><![CDATA[>');
            
            // Generate the exact HTML stub used to host PyNote
            const htmlStub = `
<div style="border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; margin-bottom: 20px;">
    <!-- REPLACE 'YOUR_DOMAIN' WITH YOUR ACTUAL HOSTING URL -->
    <iframe id="pynote-iframe" src="https://YOUR_DOMAIN.com/widget-notebook.html" scrolling="no" style="width: 100%; border: none; display: block; transition: height 0.15s ease-out;"></iframe>
</div>
<textarea id="pynote-database" style="display:none;">${safeFlatData}</textarea>

<script>
    (function() {
        const iframe = document.getElementById('pynote-iframe');
        const db = document.getElementById('pynote-database');
        
        // Ensure Question Mode is ON by default for Moodle assignments!
        const config = { showTopBar: true, kernelType: 'skulpt', autocompleteMode: 'custom', questionMode: true };
        
        window.addEventListener('message', (event) => {
            if (event.data.type === 'REQUEST_CONTENT') {
                iframe.contentWindow.postMessage({ type: 'LOAD_CONTENT', payload: db.value, config: config }, '*');
            } else if (event.data.type === 'SYNC_HEIGHT') {
                iframe.style.height = event.data.payload + 'px';
            } else if (event.data.type === 'SYNC_CONTENT') {
                db.value = event.data.payload;
                iframe.contentWindow.postMessage({ type: 'ACK_CONTENT', msgId: event.data.msgId }, '*');
            }
        });
    })();
<\\/script>`.trim();

            const safeHtmlStub = htmlStub.replace(/]]>/g, ']]]]><![CDATA[>');

            // Wrap in Moodle XML Question Format (Essay type handles custom HTML well)
            const moodleXml = `<?xml version="1.0" encoding="UTF-8"?>
<quiz>
  <question type="essay">
    <name>
      <text>PyNote Interactive Notebook</text>
    </name>
    <questiontext format="html">
      <text><![CDATA[${safeHtmlStub}]]></text>
    </questiontext>
    <responseformat>noinline</responseformat>
    <responserequired>0</responserequired>
  </question>
</quiz>`;

            downloadFile('pynote-moodle-export.xml', moodleXml);
        };

        // --- 4. IMPORT LOGIC ---
        const fileInput = document.getElementById('file-upload');
        document.getElementById('menu-file-load').onclick = (e) => { e.preventDefault(); fileInput.click(); };

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const content = event.target.result;
                let parsedCells;
                
                // If it's a Jupyter Notebook (.ipynb)
                if (file.name.endsWith('.ipynb')) {
                    try {
                        const ipynb = JSON.parse(content);
                        parsedCells = ipynb.cells.map(c => {
                            const type = c.cell_type === 'markdown' ? 'markdown' : 'code';
                            const contentStr = Array.isArray(c.source) ? c.source.join('') : (c.source || '');
                            return {
                                type: type,
                                content: contentStr.replace(/\\n+$/, ''), // Clean trailing Jupyer newlines
                                isLocked: c.metadata && c.metadata.pynote_locked ? true : false,
                                isEditing: false
                            };
                        });
                    } catch (err) {
                        alert("Invalid Jupyter Notebook format.");
                        return;
                    }
                } else {
                    // Otherwise parse as PyNote Flatfile
                    parsedCells = window.notebookCore.deserializeFromFlat(content);
                }
                
                window.notebookCore.loadData(parsedCells);
                window.triggerHostSync(window.notebookCore.serializeToFlat());
                fileInput.value = ''; 
            };
            reader.readAsText(file);
        });

        // --- 5. SETTINGS LOGIC ---
        function toggleConfiguration(settingKey) {
            const currentData = window.notebookCore.serializeToFlat();
            currentOptions[settingKey] = !currentOptions[settingKey];
            initNotebook(currentData);
            document.getElementById('check-question').classList.toggle('hidden', !currentOptions.questionMode);
            document.getElementById('check-readonly').classList.toggle('hidden', !currentOptions.isReadOnly);
        }

        document.getElementById('menu-setting-question').onclick = (e) => { e.preventDefault(); toggleConfiguration('questionMode'); };
        document.getElementById('menu-setting-readonly').onclick = (e) => { e.preventDefault(); toggleConfiguration('isReadOnly'); };

        // --- 6. BOOTSTRAP DEFAULT CONTENT ---
        const initialData = `# %% [markdown]
"""
### Welcome to PyNote! 🚀
Try clicking **File > Save as .ipynb** and opening the downloaded file in Jupyter Lab or VS Code. It works flawlessly!
"""

# %% [code]
print("PyNote Native Integration")
`;
        initNotebook(initialData);

    </script>
</body>
</html>
